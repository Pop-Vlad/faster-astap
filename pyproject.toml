[build-system]
# PEP 639 license metadata needs a recent scikit-build-core.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "faster-astap"
# One version for the whole repository, continuing the v0.1.0 to v0.3.0 tags the
# C++ solvers were released under: the package and the solvers are one piece of
# work and a second numbering for the same commit would only confuse.
#
# The .devN suffix is for proving the release pipeline out on TestPyPI, since no
# index ever lets a version be uploaded twice. Dev releases sort before the real
# one, so 0.4.0 itself stays free. Drop the suffix and tag v0.4.0 to release.
version = "0.4.0.dev1"
description = "Fast astrometric plate solving: ASTAP's algorithm in C++, plus a whole-sky index solver"
readme = "README.md"
requires-python = ">=3.9"
# SPDX expression rather than the old free text plus classifier pair. The
# licence file travels with the wheel and the sdist because MPL-2.0 requires the
# notice to stay with the code — this is a port of Han Kleijn's ASTAP algorithm,
# published under the same licence, not a work that could be relicensed.
license = "MPL-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vlad Pop" }]
keywords = ["astronomy", "astrometry", "plate solving", "astap", "wcs", "fits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
wcs = ["astropy>=5.0"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/Pop-Vlad/faster-astap"
Source = "https://github.com/Pop-Vlad/faster-astap"
Issues = "https://github.com/Pop-Vlad/faster-astap/issues"

[tool.scikit-build]
# The package is laid out under python/, so that the C++ sources at the top of
# the repository stay where the CMake build expects them.
wheel.packages = ["python/faster_astap"]
cmake.version = ">=3.15"
build-dir = "build/{wheel_tag}"
# Only the extension. Left to itself CMake would also build the two command line
# solvers, the benchmarks and the test binaries, none of which go in the wheel.
build.targets = ["_core"]
# The corpus is hundreds of megabytes of survey cutouts that anyone can refetch
# with tools/fetch_skyview_corpus.py, and the rest is build output. Everything
# CMake needs to configure — CMakeLists.txt, include/, src/, tests/, python/ —
# stays in, because an sdist that cannot build is not a source distribution.
sdist.exclude = [
    "corpus",
    "cmake-build-*",
    "build",
    "dist",
    "wheelhouse",
    "nina-plugin/plugin",
]

[tool.scikit-build.cmake.define]
ASTAP_PYTHON = "ON"
# The two command line solvers and the N.I.N.A. server are not part of the
# wheel, and building them would only slow it down.
ASTAP_NINA_INTEGRATION = "OFF"
# That option exists so the shipped .exe files carry their own runtime. An
# extension module must not: it is loaded into a process that already has one,
# and a second static copy of the C runtime beside python3xx.dll means two heaps
# and two sets of file descriptors in the same process. The interpreter is what
# decides the runtime here, so the wheel takes it dynamically like everything
# else in the process.
ASTAP_STATIC_RUNTIME = "OFF"

[tool.cibuildwheel]
# Here rather than as CIBW_* environment variables in the workflow, so that the
# build a maintainer runs locally with `cibuildwheel` is the one CI runs, and so
# an upgrade of the action cannot silently change what is built.
#
# 32 bit is not worth supporting for a solver that maps multi-gigabyte index
# files, and musl and PyPy cost build time for very few users of this.
skip = ["pp*", "*-win32", "*_i686", "*-musllinux_*"]

# Proves the wheel imports on a machine with none of the build tools on it. It
# cannot prove solving: that needs a star database, which is gigabytes and not
# ours to ship, so most of the suite reports itself skipped here.
test-requires = "pytest"
test-command = "python -c \"import faster_astap as fa; print(fa.__version__, fa.supported_image_extensions())\" && python -m pytest {project}/python/tests -q"

[tool.cibuildwheel.linux]
# GCC 12: comfortable with C++17, and new enough for std::filesystem without the
# separate library the older images want.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
