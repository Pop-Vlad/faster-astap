# Builds the wheels and publishes them.
#
# Publishing uses PyPI's Trusted Publishing, so there is no API token anywhere
# in this repository: PyPI is told which workflow in which repository may upload,
# and the job proves it is that workflow with a short lived OIDC token. Nothing
# to rotate and nothing to leak. It has to be set up once on each index, under
# your account -> Publishing -> Add a pending publisher:
#
#   PyPI project name:  faster-astap
#   Owner:              Pop-Vlad
#   Repository:         faster-astap
#   Workflow filename:  release.yml
#   Environment:        pypi          (testpypi on test.pypi.org)
#
# Then:
#   - "Run workflow" from the Actions tab publishes to TestPyPI.
#   - Pushing a v* tag publishes to PyPI proper.
#
# A version can never be uploaded twice, on either index, so iterate on TestPyPI
# with 0.1.0.dev1, 0.1.0.dev2 and keep the real version for the real thing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pypa/cibuildwheel@v2.21
        env:
          # 32 bit is not worth supporting for a solver that maps multi-gigabyte
          # index files, and musl and PyPy add build time for very few users.
          CIBW_SKIP: "pp* *-win32 *_i686 *-musllinux_*"
          # GCC 12: comfortable with C++17, and new enough for std::filesystem
          # without the separate library the older images need.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # std::filesystem needs 10.15. macos-13 builds x86_64, macos-latest
          # builds arm64, so each runner produces its own wheel rather than one
          # universal2 that doubles the size for everybody.
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          # Proves the wheel imports on a clean machine with none of the build
          # tools present. It cannot prove solving: that needs a star database,
          # which is gigabytes and not ours to ship.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >
            python -c "import faster_astap as fa; print(fa.__version__, fa.supported_image_extensions())" &&
            python -m pytest {project}/python/tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: wheelhouse/*.tar.gz

  testpypi:
    name: Publish to TestPyPI
    # Manual runs only: a tag goes to the real index below.
    if: github.event_name == 'workflow_dispatch'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # the OIDC token Trusted Publishing is built on
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
