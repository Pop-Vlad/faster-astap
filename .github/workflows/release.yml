# Builds the wheels and publishes them.
#
# Publishing uses PyPI's Trusted Publishing, so there is no API token anywhere
# in this repository: PyPI is told which workflow in which repository may upload,
# and the job proves it is that workflow with a short lived OIDC token. Nothing
# to rotate and nothing to leak. It has to be set up once on each index, under
# your account -> Publishing -> Add a pending publisher:
#
#   PyPI project name:  faster-astap
#   Owner:              Pop-Vlad
#   Repository:         faster-astap
#   Workflow filename:  release.yml
#   Environment:        pypi          (testpypi on test.pypi.org)
#
# Then:
#   - "Run workflow" from the Actions tab publishes to TestPyPI.
#   - Pushing a v* tag publishes to PyPI proper.
#
# A version can never be uploaded twice, on either index, so iterate on TestPyPI
# with 0.1.0.dev1, 0.1.0.dev2 and keep the real version for the real thing.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # std::filesystem needs macOS 10.15, and the default for the Intel builds
      # is older than that. Only for macos-13: macos-latest is arm64, where the
      # floor is 11.0 already and cibuildwheel sets it itself. The two runners
      # each produce their own wheel rather than one universal2 that would
      # double the download for everybody.
      - name: Set the macOS deployment target
        if: matrix.os == 'macos-13'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      # Everything it builds and how it tests is in [tool.cibuildwheel] in
      # pyproject.toml, so this stays a plain invocation.
      - uses: pypa/cibuildwheel@v4

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist --outdir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: wheelhouse/*.tar.gz

  testpypi:
    name: Publish to TestPyPI
    # Manual runs only: a tag goes to the real index below.
    if: github.event_name == 'workflow_dispatch'
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # the OIDC token Trusted Publishing is built on
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The tag is what a reader will trust and the version inside the wheel is
      # what PyPI will record, so the two have to agree. Checked against the
      # built filename rather than against pyproject.toml, because that is what
      # actually gets uploaded. Worth a step of its own: an upload can never be
      # replaced or taken back, so a version published under the wrong tag is
      # permanent.
      - name: The tag and the built version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | head -1 | sed -E 's|.*/[^-]+-([^-]+)-.*|\1|')
          echo "tag=$tag  built=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match the built version $built - set the version in pyproject.toml and retag"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
